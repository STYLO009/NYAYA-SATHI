version: '3.8'
services:
  my-mongo:
    image: mongo:latest
    container_name: mongodb_container
    ports:
      - "27017:27017"

  my-mongo-express:
    image: mongo-express:latest
    container_name: mongo_express_container
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=my-mongo
